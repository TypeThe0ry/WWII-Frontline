# PR gate: /data validation (ARCHITECTURE §17.5, target < 2 min).
# M0-002 created the placeholder; M0-004 wires in tools/data-validate.
# Triggers only on data / validator changes (the sim build.rs type-check runs in test-rust).
name: data-validate
on:
  pull_request:
    paths: ["data/**", "tools/data-validate/**", ".github/workflows/data-validate.yml"]
  push:
    branches: [main]
    paths: ["data/**", "tools/data-validate/**"]
permissions:
  contents: read
jobs:
  data-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @frontline/data-validate...
      - name: Validator unit tests (rules + every invalid fixture via the CLI)
        run: pnpm -C tools/data-validate test
      - name: Fixture suite
        run: node tools/data-validate/index.mjs --fixtures
      - name: Validate /data
        run: node tools/data-validate/index.mjs --root data
