# PR gate: Rust tests (ARCHITECTURE §17.5, target < 12 min).
# Cache: Swatinem/rust-cache chosen over sccache (§17.5 mentions sccache): no remote storage
# is available yet (NEEDS_HUMAN H-014), and rust-cache needs no extra setup on hosted runners.
# Revisit with sccache + remote backend if the cold-cache time approaches the budget.
name: test-rust
# 2026-11-18: automatic triggers removed (PI-078); checks run locally via scripts/local-ci.sh.
on:
  workflow_dispatch:
concurrency:
  group: test-rust-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  test-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --locked
      - name: cargo test frontline-sim (determinism suite needs test-util)
        run: cargo test -p frontline-sim --features test-util --locked
