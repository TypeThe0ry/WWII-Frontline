# Browser WT/WS interop matrix (M0-028). Not part of the PR gate: manual + nightly.
# Chromium must pass (WT and WS, fallback); Firefox / WebKit results are recorded as they are (the job does not fail on them).
name: interop
# 2026-11-18: automatic triggers removed (PI-078); checks run locally via scripts/local-ci.sh.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the matrix (installs the Playwright browsers)
        run: INSTALL_BROWSERS=1 scripts/run-interop.sh
        env:
          # Firefox / WebKit cells are data, not gates: only the Chromium tests assert.
          FRONTLINE_INTEROP_BROWSERS: chromium,firefox,webkit
      - name: Summary
        if: always()
        run: |
          echo "## Browser interop matrix" >> "$GITHUB_STEP_SUMMARY"
          cat reports/m0/browser-matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-matrix
          path: reports/m0/browser-matrix.*
