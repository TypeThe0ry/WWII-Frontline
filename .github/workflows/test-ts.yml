# PR gate: client unit tests (ARCHITECTURE §17.5, target < 5 min).
name: test-ts
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: test-ts-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: vitest
        run: pnpm -C client test
