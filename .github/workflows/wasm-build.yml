# PR gate: sim-wasm build, size gate and Node smoke (ARCHITECTURE §17.5, target < 8 min).
# Pinned tools: wasm-bindgen 0.2.130 (Cargo.toml `=`; wasm-pack fetches the matching CLI),
# binaryen version_132 (wasm-opt), wasm-pack 0.15.1.
name: wasm-build
# 2026-11-18: automatic triggers removed (PI-078); checks run locally via scripts/local-ci.sh.
on:
  workflow_dispatch:
concurrency:
  group: wasm-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  BINARYEN_VERSION: version_132
jobs:
  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-opt (binaryen)
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" -o binaryen.tgz
          mkdir -p "$HOME/binaryen" && tar xzf binaryen.tgz -C "$HOME/binaryen" --strip-components=1
          echo "$HOME/binaryen/bin" >> "$GITHUB_PATH"
      - name: wasm-pack build
        run: wasm-pack build crates/sim-wasm --target web --profile wasm-release
      - name: Size gate (wasm-opt -O3; <= 1.2 MB, brotli <= 400 KB)
        run: node tools/ci/check-wasm-size.mjs
      - name: Generate M0 terrain (numpy)
        run: |
          python3 -m pip install numpy
          PYTHONPATH=tools/map-pipeline python3 -m map_pipeline m0 --seed 1 --out data/maps/m0
      - name: Native reference trace
        run: cargo run --release -p frontline-sim-wasm --example trace
      - name: Node smoke, native-vs-wasm comparison, step benchmark
        env:
          FRONTLINE_REQUIRE_TERRAIN: "1"
        run: |
          node crates/sim-wasm/tests/node-smoke.mjs
          node crates/sim-wasm/tests/native-vs-wasm.mjs || echo "::warning::native vs wasm drift (non-blocking per R5, see M0-029)"
          node crates/sim-wasm/tests/bench.mjs
