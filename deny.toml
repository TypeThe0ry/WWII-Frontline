# cargo-deny configuration (M0-002; ARCHITECTURE §17.5, §4.5).
#
# TODO(H-037): the license allow-list below is the CONSERVATIVE default set from
# LICENSES §5 (MIT / Apache-2.0 / BSD / ISC / Zlib / CC0 / Unicode). It is NOT yet
# confirmed by the human owner (NEEDS_HUMAN H-037). Weak-copyleft (MPL, LGPL) and
# GPL/AGPL families are deliberately absent, so any crate under them fails CI until a
# case-by-case decision is recorded here. Unknown licenses are blocked.
#
# Crate-to-crate direction rules (§4.5) are NOT expressed here; they are enforced by
# tools/ci/check-deps.mjs because cargo-deny cannot express per-crate wrappers cleanly.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",
]
exceptions = []

[licenses.private]
# Workspace crates are publish = false; their own license field is not audited.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path dependencies carry no version
deny = [
  # TLS goes through rustls only; no OpenSSL anywhere in the tree.
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
