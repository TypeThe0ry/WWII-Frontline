# cargo-deny configuration (M0-002; ARCHITECTURE §17.5, §4.5).
#
# H-037 provisional decision (临时决定，TT 可推翻; see docs/PLAN_ISSUES.md):
# Permissive allow-list (MIT / Apache-2.0 / BSD-2-Clause / BSD-3-Clause / ISC / Zlib /
# CC0-1.0 / Unicode-3.0 / Unicode-DFS-2016) plus MPL-2.0 (dependencies only; workspace
# crates remain private/non-MPL). LGPL/GPL/AGPL families remain blocked; unknown
# licenses are blocked. Any crate outside this list requires a documented entry in
# `exceptions` below.
#
# Crate-to-crate direction rules (§4.5) are NOT expressed here; they are enforced by
# tools/ci/check-deps.mjs because cargo-deny cannot express per-crate wrappers cleanly.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0", # dependencies only
]
exceptions = []

[licenses.private]
# Workspace crates are publish = false; their own license field is not audited.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # workspace path dependencies carry no version
deny = [
  # TLS goes through rustls only; no OpenSSL anywhere in the tree.
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
