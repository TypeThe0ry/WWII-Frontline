# M1-066 local development compose template (gateway + match server + static client).
# For native one-command dev workflow (with Vite HMR), use `./dev.sh up` from the repo root.
services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_BIND: "0.0.0.0:8080"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}"
      TOKEN_SECRET: "${TOKEN_SECRET:?set TOKEN_SECRET in .env}"
      TICKET_SIGNING_KEY_FILE: "/var/lib/gateway/ticket-key.bin"
      ALLOWED_ORIGINS: "http://127.0.0.1:${STATIC_PORT:-8081},http://localhost:${STATIC_PORT:-8081}"
    volumes:
      - gateway_data:/var/lib/gateway
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10

  server:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.server
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${FRONTLINE_WS_PORT:-7000}:7000/tcp"
      - "${FRONTLINE_WT_PORT:-7001}:7001/udp"
      - "${FRONTLINE_METRICS_PORT:-9100}:9100/tcp"
    environment:
      GATEWAY_URL: "http://gateway:8080"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}"
      FRONTLINE_MAP: "${FRONTLINE_MAP:-m0}"
      FRONTLINE_MODE: "${FRONTLINE_MODE:-sandbox}"
      FRONTLINE_BOTS: "${FRONTLINE_BOTS:-0}"
      FRONTLINE_PUBLIC_ADDR: "${FRONTLINE_PUBLIC_ADDR:-127.0.0.1}"
    command:
      - "--ws-port"
      - "7000"
      - "--wt-port"
      - "7001"
      - "--metrics-port"
      - "9100"
      - "--cert"
      - "/certs/dev-cert.pem"
      - "--key"
      - "/certs/dev-key.pem"
      - "--data-dir"
      - "/data"
      - "--spool-dir"
      - "/tmp/spool"
    volumes:
      - ../../data:/data:ro
      - ../../dev-cert:/certs:ro

  static:
    image: nginx:1.27-alpine
    ports:
      - "${STATIC_PORT:-8081}:80"
    volumes:
      - ../../client/dist:/usr/share/nginx/html:ro
    depends_on:
      - gateway

volumes:
  gateway_data:
