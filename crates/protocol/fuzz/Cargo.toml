[package]
name = "frontline-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.frontline-protocol]
path = ".."

[workspace]
members = ["."]

[[bin]]
name = "snapshot_decode"
path = "fuzz_targets/snapshot_decode.rs"
test = false
doc = false

[[bin]]
name = "input_bundle_decode"
path = "fuzz_targets/input_bundle_decode.rs"
test = false
doc = false

[[bin]]
name = "c0"
path = "fuzz_targets/c0.rs"
test = false
doc = false

[[bin]]
name = "c4"
path = "fuzz_targets/c4.rs"
test = false
doc = false

[[bin]]
name = "events"
path = "fuzz_targets/events.rs"
test = false
doc = false

[[bin]]
name = "snapshot_vehicle"
path = "fuzz_targets/snapshot_vehicle.rs"
test = false
doc = false
