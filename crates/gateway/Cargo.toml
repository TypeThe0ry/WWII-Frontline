[package]
name = "frontline-gateway"
description = "Frontline gateway: server list, guest auth, join tickets, internal match API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "frontline_gateway"
path = "src/lib.rs"

[[bin]]
name = "frontline-gateway"
path = "src/main.rs"

[dependencies]
frontline-protocol = { path = "../protocol" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
