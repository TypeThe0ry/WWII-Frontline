[package]
name = "frontline-sim-wasm"
description = "Frontline sim + protocol wasm-bindgen wrapper for the TS client (M0-014)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
# wasm-bindgen glue and the zero-copy `js_sys::*Array::view` accessors need unsafe
# (relaxed from the workspace `forbid`; every unsafe block carries a SAFETY comment).
unsafe_code = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
frontline-sim = { path = "../sim", features = ["client-predict"] }
frontline-protocol = { path = "../protocol" }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
arrayvec = { version = "0.7", default-features = false }

[build-dependencies]
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
# Optimised by tools/ci/check-wasm-size.mjs with a pinned wasm-opt (binaryen) instead.
wasm-opt = false

[package.metadata.wasm-pack.profile.wasm-release]
wasm-opt = false
