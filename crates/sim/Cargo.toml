[package]
name = "frontline-sim"
description = "Frontline deterministic simulation core (M0-007)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
frontline-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bevy_ecs = { version = "=0.16.1", default-features = false }
glam = { version = "=0.34.3", default-features = false, features = ["libm"] }
libm = "=0.2.16"
rand_core = "=0.10.1"
rand_pcg = "=0.10.2"
# Rapier: exact pin; enhanced-determinism excludes simd*/parallel (PI-013).
rapier3d = { version = "=0.36.1", default-features = false, features = ["dim3", "f32", "std", "enhanced-determinism"] }

[features]
client-predict = []
# Test-only system that draws RNG and jitters positions every tick (see world.rs). Also turns on
# `client-predict` so that the World-vs-PredictSim tests run under `--features test-util`.
test-util = ["client-predict"]

[[test]]
name = "determinism_basic"
required-features = ["test-util"]

[[test]]
name = "movement_world_vs_predict"
required-features = ["client-predict"]

[[test]]
name = "weapon_duel"
required-features = ["client-predict"]

[[bench]]
name = "kcc"
harness = false

[[bench]]
name = "world_step_empty"
harness = false

[[bench]]
name = "collision"
harness = false

[[bench]]
name = "ballistics"
harness = false

