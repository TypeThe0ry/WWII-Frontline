[package]
name = "frontline-server"
description = "Frontline server (M0-001 skeleton)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

build = "build.rs"

[lints]
workspace = true

[dependencies]
frontline-sim = { path = "../sim" }
frontline-protocol = { path = "../protocol" }
frontline-bots = { path = "../bots" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "fs", "signal", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
prometheus = { version = "0.14", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio-tungstenite = "0.26"
futures-util = "0.3.34"
bytes = "1.12.1"
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
wtransport = { version = "=0.7.2", features = ["quinn"] }

[[bin]]
name = "frontline-server"
path = "src/main.rs"

[[bench]]
name = "aoi_encode"
harness = false

[[bench]]
name = "ticket_verify"
harness = false

[[bench]]
name = "anticheat_on_input"
harness = false

[dev-dependencies]
criterion = { version = "0.7", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
frontline-sim = { path = "../sim", features = ["test-util"] }
