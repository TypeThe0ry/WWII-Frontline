[project]
name = "frontline-ref-analysis"
version = "0.1.0"
description = "Frontline black-box reference-capture analysis toolchain (M0-032, REFERENCE_MEASUREMENTS section 3/7/8)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["ffmpeg: needs ffmpeg/ffprobe on PATH (skipped when missing)"]
